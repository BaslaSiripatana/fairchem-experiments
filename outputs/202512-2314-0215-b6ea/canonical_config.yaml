      config:
        format: fairchem.core.datasets.rmd17.MD17
        seed: 0
        splits:
          train:
            src: /home/siripab/fairchem/data/rmd17/lmdb/aspirin/train
            sample_n: 100
          val:
            src: /home/siripab/fairchem/data/rmd17/lmdb/aspirin/val
            sample_n: 50
      split: train
    batch_sampler_fn:
      _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
      _partial_: true
      max_atoms: 350
      shuffle: true
      seed: 0
    num_workers: 4
    collate_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
      tasks:
      - name: rmd17_energy
        level: graph
        property: energy
        inference_only: false
        out_spec:
          dim:
          - 1
          dtype: float32
        datasets:
        - rmd17
        train_on_free_atoms: false
        eval_on_free_atoms: false
        loss_fn: mae
        target_key: 'y'
        head: energy
        coefficient: 1.0
